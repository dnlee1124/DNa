      overflow-x: hidden;
    }

    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3.2s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: .2; transform: scale(.75); }
      50% { opacity: .85; transform: scale(1); }
    }
    .container { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 48px; }

    .header-emoji {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-family: 'Alex Brush', cursive;
      font-size: 52px;
      font-weight: 400;
      color: var(--text);
      text-shadow: 0 1px 4px rgba(0,0,0,.35);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 32px 0 24px;
      color: var(--text-sub);
      font-size: 13px;
      font-family: 'Gowun Dodum', sans-serif;
    }
    .divider .list-text {
      font-family: 'Dancing Script', cursive;
      font-weight: 600;
      font-size: 22px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(185, 174, 221, 0.3);
    }

    .card-grid { display: flex; flex-direction: column; gap: 12px; }

    .card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 18px 20px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(172, 166, 255, 0.32);
      box-shadow: 0 0 0 1px rgba(172, 166, 255, 0.05), 0 0 16px rgba(172, 166, 255, 0.28), 0 0 30px rgba(172, 166, 255, 0.14);
      position: relative;
      overflow: hidden;
      font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 1px rgba(172, 166, 255, 0.08), 0 0 20px rgba(172, 166, 255, 0.36), 0 0 36px rgba(172, 166, 255, 0.18);
    }

    .card-emoji {
      font-size: 28px;
      width: 48px;
      height: 48px;
      background: rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .card-info { flex: 1; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--text); }
    .card-desc { margin-top: 3px; font-size: 12px; color: var(--text-sub); }
    .card-arrow { font-size: 18px; color: var(--text-sub); flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) {
      .header-emoji { animation: none; }
      .card { transition: none; }
    }
    @media (max-width: 480px) {
      body { padding: 40px 16px 60px; }
      h1 { font-size: 42px; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <header>
      <span class="header-emoji">🌙</span>
      <h1>Dana's Page</h1>
    </header>
    <div class="divider">✦ <span class="list-text">List</span> ✦</div>
    <div class="card-grid">
      <a href="홈택스수임동의신청서.html" class="card">
        <div class="card-emoji">📄</div>
        <div class="card-info">
          <div class="card-title">홈택스 수임동의 신청서</div>
          <div class="card-desc">수임동의신청서를 쉽게 작성해요</div>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- 새 파일을 추가할 때 아래 형식으로 복사하세요:
      <a href="파일명.html" class="card">
        <div class="card-emoji">🗂️</div>
        <div class="card-info">
          <div class="card-title">표시할 이름</div>
          <div class="card-desc">간단한 설명</div>
        </div>
        <div class="card-arrow">→</div>
      </a>
      -->
    </div>
  </div>

  <script>
    (function(){
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var el = document.getElementById('stars');
      var count = 50;
      for (var i = 0; i < count; i++) {
        var s = document.createElement('div');
        s.className = 'star';
        var size = (Math.random() * 1.8 + 0.9).toFixed(1);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.left = (Math.random() * 100).toFixed(1) + '%';
        s.style.top = (Math.random() * 100).toFixed(1) + '%';
        if (reduceMotion) {
          s.style.animation = 'none';
          s.style.opacity = '.6';
        } else {
          s.style.animationDelay = (Math.random() * 3.2).toFixed(2) + 's';
          s.style.animationDuration = (2.8 + Math.random() * 2).toFixed(2) + 's';
        }
        el.appendChild(s);
      }
    })();
  </script>
</body>
</html>
