<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홈택스 세무대리정보 이용(해지)신청서 작성</title>
<style>
  :root{
    --ink:#000000;
    --stamp:#c62828;
    --border:#dcdfe6;
    --bg:#f4f5f7;
    --panel:#ffffff;
    --accent:#2f5bd7;
    --s:1;
  }
  *{box-sizing:border-box;}
  .hidden{display:none!important;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:#222;
  }
  .app{
    display:flex;
    gap:20px;
    padding:20px;
    align-items:flex-start;
    min-height:100vh;
  }
  .left-panel{
    flex:0 0 460px;
    max-width:460px;
    background:var(--panel);
    border-radius:12px;
    padding:20px 22px 28px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    max-height:calc(100vh - 40px);
    overflow-y:auto;
  }
  .right-panel{
    flex:1;
    position:sticky;
    top:20px;
    display:flex;
    justify-content:center;
  }
  h1{font-size:17px;margin:0 0 16px;}
  h2{font-size:14px;margin:22px 0 10px;padding-bottom:6px;border-bottom:2px solid #222;}
  section:first-of-type h2{margin-top:0;}
  .opt{font-weight:400;color:#888;font-size:12px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12.5px;color:#444;margin-bottom:4px;}
  .field input[type=text],
  .field input:not([type]),
  input.text-input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--border);
    border-radius:6px;
    font-size:13px;
    font-family:inherit;
  }
  .field input:disabled{background:#f0f1f3;color:#999;}
  .field-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .inline{display:flex;gap:6px;}
  .inline input{flex:1;}
  .radio-row{display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .radio-row label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .radio-row.row-inline{flex-direction:row;flex-wrap:wrap;gap:20px;}
  .dropzone{position:relative;border:1.5px dashed #b7bccb;border-radius:8px;padding:14px 10px;text-align:center;background:#fafbfc;transition:background .15s,border-color .15s;}
  .dropzone.dragover{background:#eef3ff;border-color:var(--accent);}
  .dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .dz-label{font-size:12px;color:#888;pointer-events:none;}
  .type-row{display:flex;gap:16px;margin-bottom:14px;font-size:13.5px;}
  .type-row label{display:flex;align-items:center;gap:6px;cursor:pointer;}
  .biz-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-bottom:8px;}
  .biz-row .field{margin-bottom:0;}
  .btn-remove-row{
    height:36px;padding:0 10px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;color:#a33;
  }
  #btn-add-biz{
    margin-bottom:14px;padding:7px 12px;border:1px dashed #99a;border-radius:6px;background:#fafbff;cursor:pointer;font-size:12.5px;color:#445;
  }
  .id-preview{margin-top:8px;display:flex;align-items:center;gap:10px;}
  .id-preview img{width:70px;height:auto;border:1px solid var(--border);border-radius:4px;}
  .id-preview .rm-btn{border:none;background:none;color:#a33;font-size:12px;cursor:pointer;text-decoration:underline;}
  .consent-fixed{font-size:13px;background:#f3f6ff;border:1px solid #dbe3ff;padding:10px 12px;border-radius:8px;margin:0;}
  .actions{display:flex;gap:10px;margin-top:20px;}
  .btn-primary,.btn-secondary{
    flex:1;padding:12px;border-radius:8px;border:none;font-size:14px;font-weight:700;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#2447b3;}
  .btn-secondary{background:#eceef2;color:#555;}
  .btn-secondary:hover{background:#e0e2e8;}
  .hint{font-size:11.5px;color:#888;margin-top:10px;min-height:14px;}
  input[type=file]{font-size:12px;}
  button.edit-btn{
    padding:0 12px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px;
  }

  .preview-wrap{width:min(700px,46vw);}
  .preview{
    position:relative;
    width:100%;
    aspect-ratio:595.32/841.92;
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
  }
  .preview .bg{
    position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;pointer-events:none;
  }
  .ov{position:absolute;overflow:hidden;}
  .ov-text{
    display:flex;align-items:center;
    font-size:calc(1.55cqw);
    line-height:1.1;
    color:var(--ink);
    font-weight:600;
    white-space:nowrap;
  }
  .ov-date{justify-content:center;}
  .ov-center{justify-content:center;}
  .ov-small{font-size:calc(1.2cqw);}
  .ov-check{
    display:flex;align-items:center;justify-content:center;
    color:#111;font-weight:900;font-size:calc(1.9cqw);
    opacity:0;
  }
  .ov-check.show{opacity:1;}
  .stamp-slot{display:flex;align-items:center;justify-content:center;overflow:visible;}
  .stamp-slot svg{overflow:visible;mix-blend-mode:multiply;opacity:.9;}
  .preview-wrap{container-type:inline-size;}

  @media (max-width:980px){
    .app{flex-direction:column;}
    .left-panel{max-width:100%;flex:none;max-height:none;}
    .preview-wrap{width:100%;}
    .right-panel{position:static;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="left-panel">
    <h1>홈택스 세무대리정보 이용(해지)신청서 작성</h1>

    <section>
      <h2>1. 신청인 정보</h2>
      <div class="type-row">
        <label><input type="radio" name="etype" value="individual" id="et_individual" checked> 개인</label>
        <label><input type="radio" name="etype" value="corp" id="et_corp"> 법인</label>
      </div>
      <div class="field">
        <label>① 성명(대표자명)</label>
        <input type="text" id="ap_name" placeholder="예: 홍길동">
      </div>
      <div class="field">
        <label>② 주민등록번호(외국인등록번호 등)</label>
        <input type="text" id="ap_ssn" placeholder="000000-0000000">
      </div>

      <div id="biz-rows">
        <div class="biz-row" data-idx="1">
          <div class="field"><label>③-1 상호(법인명) <span class="opt">선택</span></label><input type="text" class="biz_name" data-idx="1"></div>
          <div class="field"><label>④-1 사업자등록번호 <span class="opt">선택</span></label><input type="text" class="biz_reg" data-idx="1" placeholder="000-00-00000"></div>
          <span></span>
        </div>
        <div class="biz-row hidden" data-idx="2">
          <div class="field"><label>③-2 상호(법인명)</label><input type="text" class="biz_name" data-idx="2"></div>
          <div class="field"><label>④-2 사업자등록번호</label><input type="text" class="biz_reg" data-idx="2" placeholder="000-00-00000"></div>
          <button type="button" class="btn-remove-row" data-idx="2">삭제</button>
        </div>
        <div class="biz-row hidden" data-idx="3">
          <div class="field"><label>③-3 상호(법인명)</label><input type="text" class="biz_name" data-idx="3"></div>
          <div class="field"><label>④-3 사업자등록번호</label><input type="text" class="biz_reg" data-idx="3" placeholder="000-00-00000"></div>
          <button type="button" class="btn-remove-row" data-idx="3">삭제</button>
        </div>
      </div>
      <button type="button" id="btn-add-biz">+ 사업장(상호) 추가</button>

      <div class="field">
        <label>⑤ 휴대전화번호</label>
        <div class="inline">
          <input type="text" id="ap_mobile" value="010-0000-0000" disabled>
          <button type="button" class="edit-btn" id="btn-edit-mobile">수정</button>
        </div>
      </div>
    </section>

    <section>
      <h2>2. 신청 구분</h2>
      <div class="radio-row">
        <label><input type="radio" name="app_type" value="use" id="rt_use" checked> ⑥ 정보이용 신청</label>
        <label><input type="radio" name="app_type" value="renew" id="rt_renew"> ⑦ 기존 정보이용 해지 후 새로운 정보이용 신청</label>
        <label><input type="radio" name="app_type" value="cancel" id="rt_cancel"> ⑧ 정보이용 해지신청</label>
      </div>
    </section>

    <section>
      <h2>3. 세무대리정보 이용구분 및 기간 <span class="opt">(정보이용 신청 시 작성)</span></h2>
      <div class="radio-row">
        <label><input type="radio" name="usage_scope" value="bookkeeping" id="us_bookkeeping" checked> 기장대리 : 동의 처리일로부터 해지일까지</label>
        <label><input type="radio" name="usage_scope" value="report" id="us_report"> 신고대리 : 동의 처리일로부터 신고기한까지</label>
        <label><input type="radio" name="usage_scope" value="external" id="us_external"> 외부조정(법인) : 동의 처리일로부터 신고기한까지</label>
      </div>
    </section>

    <section>
      <h2>위임받은 사람 (담당자) <span class="opt">· 값이 자동 저장됩니다</span></h2>
      <div class="field">
        <label>성명</label>
        <input type="text" id="dg_name" placeholder="예: 김세무">
      </div>
      <div class="field">
        <label>주민등록번호</label>
        <input type="text" id="dg_ssn" placeholder="000000-0000000">
      </div>
      <div class="field">
        <label>연락처(전화번호)</label>
        <div class="inline">
          <input type="text" id="dg_phone" value="031-783-8877" disabled>
          <button type="button" class="edit-btn" id="btn-edit-dgphone">수정</button>
        </div>
      </div>
      <div class="field">
        <label>신분증 사본</label>
        <div class="dropzone" id="dg_dropzone">
          <input type="file" id="dg_id_file" accept="image/*">
          <span class="dz-label">클릭하거나 파일을 여기로 드래그하세요</span>
        </div>
        <div class="id-preview" id="dg_id_preview"></div>
      </div>
    </section>

    <section>
      <h2>신청인 신분증 첨부</h2>
      <div class="field">
        <div class="dropzone" id="ap_dropzone">
          <input type="file" id="ap_id_file" accept="image/*">
          <span class="dz-label">클릭하거나 파일을 여기로 드래그하세요</span>
        </div>
        <div class="id-preview" id="ap_id_preview"></div>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn-secondary" id="btn-reset">새 신청서(초기화)</button>
      <button type="button" class="btn-primary" id="btn-export">PDF 파일 저장하기</button>
    </div>
    <p class="hint" id="save-status">&nbsp;</p>
  </div>

  <div class="right-panel">
    <div class="preview-wrap">
      <div class="preview" id="preview">

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  function $(id){ return document.getElementById(id); }
  function digits(s){ return (s||"").replace(/\D/g,""); }

  function formatMobile(raw){
    var d = digits(raw).slice(0,11);
    if(d.length<=3) return d;
    if(d.length<=7) return d.slice(0,3)+"-"+d.slice(3);
    if(d.length===10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
    return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7,11);
  }
  function formatSSN(raw){
    var d = digits(raw).slice(0,13);
    if(d.length<=6) return d;
    return d.slice(0,6)+"-"+d.slice(6,13);
  }
  function formatBizReg(raw){
    var d = digits(raw).slice(0,10);
    if(d.length<=3) return d;
    if(d.length<=5) return d.slice(0,3)+"-"+d.slice(3);
    return d.slice(0,3)+"-"+d.slice(3,5)+"-"+d.slice(5,10);
  }

  function liveFormat(input, formatter){
    input.addEventListener("input", function(){
      var pos = input.selectionStart;
      var before = input.value.length;
      input.value = formatter(input.value);
      var after = input.value.length;
      var newPos = Math.max(0, pos + (after-before));
      try{ input.setSelectionRange(newPos,newPos); }catch(e){}
      renderAll();
    });
  }

  // ---------- persistence (위임받은 사람 = 담당자, 반복 사용) ----------
  var LS_NAME = "hometax_delegate_name";
  var LS_SSN  = "hometax_delegate_ssn";
  var LS_PHONE = "hometax_delegate_phone";
  var LS_ID   = "hometax_delegate_idimg";

  function saveDelegate(){
    try{
      localStorage.setItem(LS_NAME, $("dg_name").value || "");
      localStorage.setItem(LS_SSN, $("dg_ssn").value || "");
      localStorage.setItem(LS_PHONE, $("dg_phone").value || "");
    }catch(e){}
  }
  function loadDelegate(){
    try{
      var n = localStorage.getItem(LS_NAME);
      var s = localStorage.getItem(LS_SSN);
      var p = localStorage.getItem(LS_PHONE);
      var img = localStorage.getItem(LS_ID);
      if(n) $("dg_name").value = n;
      if(s) $("dg_ssn").value = s;
      if(p) $("dg_phone").value = p;
      if(img){ delegateIdData = img; renderIdPreview("dg_id_preview", img, removeDelegateId); }
    }catch(e){}
  }

  // ---------- image resize / preview ----------
  var applicantIdData = null;
  var delegateIdData = null;

  function readAndResize(file, maxW, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        cb(canvas.toDataURL("image/jpeg",0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function renderIdPreview(containerId, dataUrl, onRemove){
    var el = $(containerId);
    el.innerHTML = "";
    if(!dataUrl) return;
    var img = document.createElement("img");
    img.src = dataUrl;
    var btn = document.createElement("button");
    btn.className = "rm-btn";
    btn.type = "button";
    btn.textContent = "삭제";
    btn.addEventListener("click", onRemove);
    el.appendChild(img);
    el.appendChild(btn);
  }

  function removeApplicantId(){
    applicantIdData = null;
    $("ap_id_file").value = "";
    renderIdPreview("ap_id_preview", null);
  }
  function removeDelegateId(){
    delegateIdData = null;
    $("dg_id_file").value = "";
    renderIdPreview("dg_id_preview", null);
    try{ localStorage.removeItem(LS_ID); }catch(e){}
  }

  $("ap_id_file").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    readAndResize(f, 1000, function(dataUrl){
      applicantIdData = dataUrl;
      renderIdPreview("ap_id_preview", dataUrl, removeApplicantId);
    });
  });
  $("dg_id_file").addEventListener("change", function(){
    var f = this.files && this.files[0];
    if(!f) return;
    readAndResize(f, 1000, function(dataUrl){
      delegateIdData = dataUrl;
      renderIdPreview("dg_id_preview", dataUrl, removeDelegateId);
      try{ localStorage.setItem(LS_ID, dataUrl); }catch(e){}
    });
  });

  // ---------- 드래그 앤 드롭 첨부 ----------
  function wireDropzone(zoneId, inputId){
    var zone = $(zoneId);
    var input = $(inputId);
    ["dragenter","dragover"].forEach(function(evt){
      zone.addEventListener(evt, function(e){
        e.preventDefault(); e.stopPropagation();
        zone.classList.add("dragover");
      });
    });
    ["dragleave","dragend"].forEach(function(evt){
      zone.addEventListener(evt, function(e){
        e.preventDefault(); e.stopPropagation();
        zone.classList.remove("dragover");
      });
    });
    zone.addEventListener("drop", function(e){
      e.preventDefault(); e.stopPropagation();
      zone.classList.remove("dragover");
      var files = e.dataTransfer && e.dataTransfer.files;
      if(!files || !files.length) return;
      var f = files[0];
      if(f.type && f.type.indexOf("image/") !== 0) return;
      try{
        var dt = new DataTransfer();
        dt.items.add(f);
        input.files = dt.files;
      }catch(err){}
      input.dispatchEvent(new Event("change"));
    });
  }

  var STAMP_COORDS = {
    app_1:{ p:{l:81.64,t:54.55,w:4.70,h:4.75}, c:{l:80.46,t:54.44,w:7.06,h:4.99} },
    app_2:{ p:{l:81.10,t:65.29,w:4.70,h:4.75}, c:{l:79.92,t:65.17,w:7.06,h:4.99} },

  var SVG_NS = "http://www.w3.org/2000/svg";
  var XLINK_NS = "http://www.w3.org/1999/xlink";
  var STAMP_RED = "#cc0a1e";
  var stampUid = 0;

  function svgEl(tag, attrs){
    var el = document.createElementNS(SVG_NS, tag);
    for(var k in attrs){ el.setAttribute(k, attrs[k]); }
    return el;
  }

  // 개인 도장: 세로로 긴 타원 + 이름을 한 글자씩 세로 한 줄로 배치
  function buildPersonalStampSVG(text, refSize){
    var chars = text.split("");
    var n = Math.max(chars.length,1);
    // 타원 크기는 글자 수와 무관하게 고정 - 글자 수가 많아지면 글자 크기를 줄여서 맞춤
    var w = refSize*1.15;
    var h = refSize*1.85;
    var margin = h*0.135;
    var innerH = h - margin*2;
    var rowFactor = 0.82;
    var fsByHeight = innerH/(n*rowFactor);
    var fsByWidth = w*0.76;
    var fs = Math.min(fsByHeight, fsByWidth);

    var svg = svgEl("svg", { width:w, height:h, viewBox:"0 0 "+w+" "+h });
    var strokeW = Math.max(Math.min(w,h)*0.075, 1.6);
    svg.appendChild(svgEl("ellipse", {
      cx:w/2, cy:h/2, rx:w/2-strokeW*0.9, ry:h/2-strokeW*0.9,
      fill:"none", stroke:STAMP_RED, "stroke-width":strokeW
    }));

    var rowH = fs*rowFactor;
    var blockH = n*rowH;
    var startY = (h-blockH)/2;
    chars.forEach(function(ch,i){
      var cy = startY + rowH*(i+0.5);
      svg.appendChild(svgEl("text", {
        x:w/2, y:cy, "text-anchor":"middle", "dominant-baseline":"central",
        "font-size":fs, "font-family":"'Malgun Gothic','Apple SD Gothic Neo',sans-serif",
        "font-weight":"700", fill:STAMP_RED
      })).textContent = ch;
    });
    return svg;
  }

  // 법인(대표자) 도장: 이중 원 + 안쪽 원에 "代表理事" + 위쪽 점 + 시계방향 상호명
  function buildCorpStampSVG(text, refSize){
    var VB = 200;
    var px = Math.max(refSize*2.375, 57);
    var svg = svgEl("svg", { width:px, height:px, viewBox:"0 0 "+VB+" "+VB });
    var cx = VB/2, cy = VB/2;
    var rOuter = VB*0.47, rInner = VB*0.26, rMid = (rOuter+rInner)/2;

    var outerCircleEl = svgEl("circle", { cx:cx, cy:cy, r:rOuter, fill:"none", stroke:STAMP_RED, "stroke-width":7 });
    svg.appendChild(outerCircleEl);
    svg.appendChild(svgEl("circle", { cx:cx, cy:cy, r:rInner, fill:"none", stroke:STAMP_RED, "stroke-width":5.5 }));

    // 위쪽 점
    svg.appendChild(svgEl("circle", { cx:cx, cy:cy-rMid, r:3.4, fill:STAMP_RED }));

    // 안쪽 원 - 대표이사(한자), 세로쓰기: 왼쪽열(代/表) 오른쪽열(理/事) - 안쪽 원 테두리에 닿도록 크게
    var tfs = (rInner*1.08)/Math.SQRT2;
    var off = tfs*0.5;
    var title = [
      { ch:"代", x:-off, y:-off },
      { ch:"表", x:-off, y: off },
      { ch:"理", x: off, y:-off },
      { ch:"事", x: off, y: off }
    ];
    var titleGroup = svgEl("g", {});
    title.forEach(function(t){
      titleGroup.appendChild(svgEl("text", {
        x:cx+t.x, y:cy+t.y, "text-anchor":"middle", "dominant-baseline":"central",
        "font-size":tfs, "font-family":"'Batang','Malgun Gothic',serif", "font-weight":"900",
        fill:STAMP_RED, stroke:STAMP_RED, "stroke-width":tfs*0.09, "paint-order":"stroke fill"
      })).textContent = t.ch;
    });
    svg.appendChild(titleGroup);
    svg._titleGroup = titleGroup;
    svg._titleCenter = { cx:cx, cy:cy, rInner:rInner, rOuter:rOuter };
    svg._outerCircleEl = outerCircleEl;

    // 점에서 시작해 시계방향(오른쪽)으로 흐르는 상호명 - 글자간격을 조정해 원을 꽉 채우고 점 위치에서 양쪽 간격이 같도록 함
    stampUid++;
    var pathId = "stampRing"+stampUid;
    var defs = svgEl("defs",{});
    var d = "M "+cx+","+(cy-rMid)+" A "+rMid+","+rMid+" 0 1 1 "+(cx-0.01)+","+(cy-rMid);
    var ringPath = svgEl("path", { id:pathId, d:d, fill:"none" });
    defs.appendChild(ringPath);
    svg.appendChild(defs);

    // "(주)"는 한 글자처럼 붙여서 취급 - 토큰 사이에만 간격을 배분
    // 점→첫글자, 글자↔글자, 마지막글자→점 간격이 모두 동일하도록 (토큰수+1)개의 동일한 간격으로 계산
    var tokens = text.match(/\(주\)|./g) || [text];
    var n = Math.max(text.length,1);
    var bandWidth = rOuter - rInner;
    var circumference = 2*Math.PI*rMid;
    var charFactor = 0.98;
    var ringFs = bandWidth*0.82;
    var naturalWidth = n*ringFs*charFactor;
    var numGaps = tokens.length+1;
    var gap = (circumference - naturalWidth)/numGaps;
    if(gap < 0){
      ringFs = Math.max((circumference*0.94)/(n*charFactor), bandWidth*0.5);
      naturalWidth = n*ringFs*charFactor;
      gap = Math.max((circumference - naturalWidth)/numGaps, 0);
    }
    var textEl = svgEl("text", {
      "font-size":ringFs, "font-family":"'Malgun Gothic','Apple SD Gothic Neo',sans-serif",
      "font-weight":"900", fill:STAMP_RED, stroke:STAMP_RED, "stroke-width":ringFs*0.06,
      "paint-order":"stroke fill",
      "dominant-baseline":"central"
    });
    var textPath = svgEl("textPath", { startOffset:gap, "dominant-baseline":"central" });
    textPath.setAttributeNS(XLINK_NS, "xlink:href", "#"+pathId);
    textPath.setAttribute("href", "#"+pathId);
    tokens.forEach(function(tok, i){
      var tspan = svgEl("tspan", i>0 ? { dx:gap } : {});
      tspan.textContent = tok;
      textPath.appendChild(tspan);
    });
    textEl.appendChild(textPath);
    svg.appendChild(textEl);

    return svg;
  }

  function applyStamp(slot, text, kind){
    slot.innerHTML = "";
    if(!text) return;
    var rect = slot.getBoundingClientRect();
    var refSize = Math.max(rect.width, rect.height, 16);
    var svg = kind==="c" ? buildCorpStampSVG(text, refSize) : buildPersonalStampSVG(text, refSize);
    var w = parseFloat(svg.getAttribute("width"));
    var h = parseFloat(svg.getAttribute("height"));
    svg.setAttribute("width", w*0.5);
    svg.setAttribute("height", h*0.5);
    slot.appendChild(svg);
    if(kind==="c" && svg._titleGroup){
      fitTitleToInnerCircle(svg, svg._titleGroup, svg._titleCenter, svg._outerCircleEl);
    }
  }

  // 실제 화면에 그려진 픽셀(getBoundingClientRect)을 바깥 원 지름 기준으로 환산해 측정.
  // 작은 크기에서는 stroke 힌팅 때문에 배율에 따라 비율이 살짝 달라질 수 있어,
  // 최종 크기에 가까운 상태에서 다시 측정→보정하는 2단계로 정확히 수렴시킴
  function measureMaxDistUnits(group, outerCircleEl, rOuter){
    var circleRect = outerCircleEl.getBoundingClientRect();
    var pxPerUnit = circleRect.width / (rOuter*2);
    if(!pxPerUnit) return 0;
    var svgCenterX = circleRect.left + circleRect.width/2;
    var svgCenterY = circleRect.top + circleRect.height/2;
    var gRect = group.getBoundingClientRect();
    var corners = [
      [gRect.left,gRect.top],[gRect.right,gRect.top],
      [gRect.left,gRect.bottom],[gRect.right,gRect.bottom]
    ];
    var maxDistPx = 0;
    corners.forEach(function(c){
      var d = Math.hypot(c[0]-svgCenterX, c[1]-svgCenterY);
      if(d>maxDistPx) maxDistPx = d;
    });
    return maxDistPx / pxPerUnit;
  }
  function setGroupScale(group, center, scale){
    group.setAttribute("transform",
      "translate("+center.cx+","+center.cy+") scale("+scale+") translate("+(-center.cx)+","+(-center.cy)+")");
  }
  function fitTitleToInnerCircle(svg, group, center, outerCircleEl){
    var margin = center.rInner*0.99;
    var scale = 1;
    for(var i=0;i<3;i++){
      var maxDistUnits = measureMaxDistUnits(group, outerCircleEl, center.rOuter);
      if(!maxDistUnits) return;
      var correction = margin/maxDistUnits;
      if(Math.abs(correction-1) < 0.01) break;
      scale = scale * correction;
      setGroupScale(group, center, scale);
    }
  }

  // ---------- PDF 내보내기 ----------
  function loadImageSize(dataUrl){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve({w:img.width,h:img.height}); };
      img.src = dataUrl;
    });
  }

  $("btn-export").addEventListener("click", function(){
    var btn = this;
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = "PDF 생성 중...";
    var previewEl = $("preview");

    html2canvas(previewEl, { scale: 3, useCORS:true, backgroundColor:"#ffffff" }).then(function(canvas){
      var imgData = canvas.toDataURL("image/png");
      var jsPDFCtor = window.jspdf.jsPDF;
      var pdf = new jsPDFCtor({ unit:"mm", format:"a4", orientation:"portrait" });
      pdf.addImage(imgData, "PNG", 0, 0, 210, 297);

      var extras = [];
      if(applicantIdData) extras.push({data:applicantIdData, label:"신청인 신분증"});
      if(delegateIdData) extras.push({data:delegateIdData, label:"위임받은 사람 신분증"});

      function addExtras(i){
        if(i >= extras.length){ finishSave(); return; }
        loadImageSize(extras[i].data).then(function(sz){
          pdf.addPage();
          var marginX = 15, marginTop = 25, maxW = 210 - marginX*2, maxH = 297 - marginTop - 15;
          var ratio = Math.min(maxW/(sz.w*0.2646), maxH/(sz.h*0.2646));
          var wmm = sz.w*0.2646*ratio, hmm = sz.h*0.2646*ratio;
          pdf.setFontSize(12);
          pdf.text(extras[i].label, 105, 15, {align:"center"});
          var x = (210-wmm)/2;
          pdf.addImage(extras[i].data, "JPEG", x, marginTop, wmm, hmm);
          addExtras(i+1);
        });
      }

      function finishSave(){
        var isCorp = $("et_corp").checked;
        var name = $("ap_name").value.trim();
        var bizName1 = document.querySelector('.biz_name[data-idx="1"]').value.trim();
        var display = (isCorp ? (bizName1 || name) : name) || "신청인";
        display = display.replace(/[\\/:*?"<>|]/g,"");
        pdf.save("홈택스수임동의신청서-"+display+".pdf");
        btn.disabled = false;
        btn.textContent = oldText;
        $("save-status").textContent = "PDF가 저장되었습니다.";
        setTimeout(function(){ $("save-status").textContent=""; }, 3000);
      }

      addExtras(0);
    }).catch(function(err){
      console.error(err);
      alert("PDF 생성 중 오류가 발생했습니다: "+err.message);
      btn.disabled = false;
      btn.textContent = oldText;
    });
  });

  // ---------- init ----------
  loadDelegate();
  updateAddBizVisibility();
  renderAll();
})();
